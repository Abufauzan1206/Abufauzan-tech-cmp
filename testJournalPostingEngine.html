<!DOCTYPE html>
<html>
<body>

<h2>ABUFAUZAN TECH CMP</h2>
<h3>Journal Posting Engine Test</h3>

<pre id="output">Running...</pre>

<script type="module">

import {
    postJournal
} from "./js/business/journalPostingEngine.js";

const output = document.getElementById("output");

let report = "";

try {

    report += "=========================================\n";
    report += "ABUFAUZAN TECH CMP\n";
    report += "JOURNAL POSTING ENGINE TEST\n";
    report += "=========================================\n\n";

    const result = await postJournal({
        title: "Cash Contribution",
date: "2026-08-04",
        debit: 50000,
        credit: 50000,
        debitAccount: "Cash Account",
        creditAccount: "Contribution Income",
        createdBy: "CMP"
    });

    report += "POST JOURNAL(): PASS\n\n";
    report += JSON.stringify(result, null, 4);

    report += "\n\n=========================================\n";
    report += "TEST COMPLETE\n";
    report += "=========================================";

}
catch (error) {

    report += "POST JOURNAL(): FAIL\n\n";
    report += error.message;

}

output.textContent = report;

</script>

</body>
</html>
