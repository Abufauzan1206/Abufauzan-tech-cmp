<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>D124 Resolver Order Trace</title>
</head>
<body>
<pre id="output">Running...</pre>

<script type="module">
import { auth, db } from "./js/firebase-config.js";
import {
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";
import {
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const output = document.getElementById("output");

function print(value) {
  output.textContent += value + "\n";
}

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    output.textContent = "AUTHENTICATION: FAIL";
    return;
  }

  try {
    output.textContent = "";

    print("D124 RESOLVER ORDER TRACE");
    print("AUTHENTICATION: PASS");
    print("TARGET DATE: 2026-09-10");

    const snapshot =
      await getDocs(collection(db, "accountingPeriods"));

    const periods = snapshot.docs.map(doc => ({
      id: doc.id,
      ...doc.data()
    }));

    const targetDate = new Date("2026-09-10");

    const matches = periods.filter(period => {
      const start = new Date(period.startDate);
      const end = new Date(period.endDate);

      return targetDate >= start && targetDate <= end;
    });

    print("MATCHING PERIODS: " + matches.length);

    matches.forEach((period, index) => {
      print("--- MATCH " + (index + 1) + " ---");
      print(JSON.stringify({
        id: period.id,
        name: period.name,
        startDate: period.startDate,
        endDate: period.endDate,
        financialYearId: period.financialYearId ?? null,
        status: period.status ?? null,
        locked: period.locked ?? null
      }, null, 2));
    });

    print("===== RESOLVER-EQUIVALENT RESULT =====");

    const selected = matches[0] ?? null;

    print(JSON.stringify({
      selectedId: selected?.id ?? null,
      selectedName: selected?.name ?? null,
      selectedFinancialYearId:
        selected?.financialYearId ?? null,
      selectedStatus: selected?.status ?? null,
      selectedLocked: selected?.locked ?? null
    }, null, 2));

    print(
      selected?.financialYearId
        ? "RESOLVER RESULT: FINANCIAL YEAR ID PRESENT"
        : "RESOLVER RESULT: FINANCIAL YEAR ID MISSING"
    );

  } catch (error) {
    output.textContent =
      "D124 RESOLVER TRACE: FAIL\n" +
      (error?.stack || error?.message || String(error));
  }
});
</script>
</body>
</html>
