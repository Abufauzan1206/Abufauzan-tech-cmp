<!DOCTYPE html>
<html>
<body>

<h2>ABUFAUZAN TECH CMP</h2>
<h3>Accounting Period Lifecycle Engine Test</h3>

<pre id="output">Running...</pre>

<script type="module">

import {
    createPeriod,
    closePeriod,
    lockPeriod,
    unlockPeriod,
    reopenPeriod
} from "./js/business/accountingPeriodEngine.js";

const output = document.getElementById("output");

let report = "";

try {

    report += "=========================================\n";
    report += "ABUFAUZAN TECH CMP\n";
    report += "ACCOUNTING PERIOD LIFECYCLE ENGINE TEST\n";
    report += "=========================================\n\n";


    const created =
        await createPeriod({

            name: "September 2026",

            startDate: "2026-09-01",

            endDate: "2026-09-30"

        });


    report += "CREATE PERIOD(): PASS\n";
    report += JSON.stringify(created, null, 4);
    report += "\n\n";


    const id =
        created.id;


    const closed =
        await closePeriod(id);

    report += "CLOSE PERIOD(): PASS\n";
    report += JSON.stringify(closed, null, 4);
    report += "\n\n";


    const locked =
        await lockPeriod(
            id,
            "CMP",
            "Month end closing"
        );

    report += "LOCK PERIOD(): PASS\n";
    report += JSON.stringify(locked, null, 4);
    report += "\n\n";


    const unlocked =
        await unlockPeriod(id);

    report += "UNLOCK PERIOD(): PASS\n";
    report += JSON.stringify(unlocked, null, 4);
    report += "\n\n";


    const reopened =
        await reopenPeriod(id);

    report += "REOPEN PERIOD(): PASS\n";
    report += JSON.stringify(reopened, null, 4);


    report += "\n\n=========================================\n";
    report += "TEST COMPLETE\n";
    report += "=========================================";


}
catch(error) {

    report += "TEST FAIL\n\n";
    report += error.message;

}


output.textContent = report;

</script>

</body>
</html>
