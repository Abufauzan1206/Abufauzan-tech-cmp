<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>D124 Contribution Read Trace</title>
</head>
<body>
<pre id="out">D124 CONTRIBUTION READ TRACE\n</pre>

<script type="module">
import { auth, db } from "./js/firebase-config.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";
import {
  collection,
  query,
  where,
  getDocs,
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const out = document.getElementById("out");
const MEMBER_ID = "ATC-MEM-2026-018077";
const COOPERATIVE_ID = "CMP-NI-1783527637336";

function log(label, value) {
  out.textContent += label + ": " + value + "\n";
}

onAuthStateChanged(auth, async (user) => {
  log("AUTHENTICATION", user ? "PASS" : "FAIL");

  if (!user) return;

  try {
    const profileSnap =
      await getDoc(doc(db, "users", user.uid));

    log("PROFILE READ", profileSnap.exists() ? "PASS" : "FAIL");

    const memberQuery = query(
      collection(db, "members"),
      where("memberId", "==", MEMBER_ID),
      where("cooperativeId", "==", COOPERATIVE_ID)
    );

    const memberSnap = await getDocs(memberQuery);

    log("MEMBER QUERY", "PASS");
    log("MEMBER MATCH COUNT", memberSnap.size);

    for (const item of memberSnap.docs) {
      log("MEMBER DOC ID", item.id);
    }

    const contributionQuery = query(
      collection(db, "contributions"),
      where("memberId", "==", MEMBER_ID),
      where("cooperativeId", "==", COOPERATIVE_ID)
    );

    const contributionSnap =
      await getDocs(contributionQuery);

    log("CONTRIBUTION QUERY", "PASS");
    log("CONTRIBUTION COUNT", contributionSnap.size);

    for (const item of contributionSnap.docs) {
      log(
        "CONTRIBUTION " + item.id,
        JSON.stringify(item.data())
      );
    }

    log("D124 READ TRACE", "PASS");
  } catch (error) {
    log("D124 READ TRACE", "FAIL");
    log("ERROR CODE", error?.code ?? "NONE");
    log("ERROR NAME", error?.name ?? "UNKNOWN");
    log("ERROR MESSAGE", error?.message ?? String(error));
  }
});
</script>
</body>
</html>
