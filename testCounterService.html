<!DOCTYPE html>
<html>
<body>

<h2>ABUFAUZAN TECH CMP</h2>
<h3>Counter Service Test</h3>

<pre id="output">Running...</pre>

<script type="module">

import { getNextSequence }
from "./js/services/counterService.js";

import { generateDocumentNumber }
from "./js/utils/generator.js";

const output = document.getElementById("output");

let report = "";

try {

report += "=========================================\n";
report += "ABUFAUZAN TECH CMP\n";
report += "COUNTER SERVICE TEST\n";
report += "=========================================\n\n";

const seq1 = await getNextSequence("JRN");
const seq2 = await getNextSequence("JRN");
const seq3 = await getNextSequence("JRN");

report += "Sequence 1: " + seq1 + "\n";
report += "Sequence 2: " + seq2 + "\n";
report += "Sequence 3: " + seq3 + "\n\n";

report += "Generated Numbers\n";
report += generateDocumentNumber("JRN", seq1) + "\n";
report += generateDocumentNumber("JRN", seq2) + "\n";
report += generateDocumentNumber("JRN", seq3) + "\n\n";

report += "=========================================\n";
report += "TEST COMPLETE\n";
report += "=========================================";

}
catch(error){

report += "ERROR:\n";
report += error.message;

}

output.textContent = report;

</script>

</body>
</html>
