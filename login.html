<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>ABUFAUZAN TECH CMP</title>

<link rel="stylesheet"
href="css/style.css">

</head>

<body class="login-page">

<div class="login-card">

<h1>🏢 ABUFAUZAN TECH</h1>

<h2>Cooperative Management Platform</h2>

<p class="tagline">
Secure • Transparent • Intelligent
</p>

<hr>

<h3>Welcome Back 👋</h3>

<p style="color:#64748B;margin-bottom:25px;">
Sign in to continue to your cooperative dashboard.
</p>

<form id="loginForm">

<div
id="loginAsContainer"
style="margin-bottom:20px;">

<label
for="loginAsRole"
style="display:block;margin-bottom:8px;font-weight:600;">

Login as

</label>

<select
id="loginAsRole"
required
style="width:100%;padding:12px;border:1px solid #CBD5E1;border-radius:8px;">

<option value="" selected disabled>
Select access category
</option>

<option value="cooperative_admin">
Cooperative Admin
</option>

<option value="member">
Member
</option>

</select>

</div>

<input
type="email"
id="email"
placeholder="📧 Email Address"
required>

<br><br>

<input
type="password"
id="password"
placeholder="🔒 Password"
required>

<br><br>

<button
type="submit"
class="btn-primary">

🔐 Sign In

</button>

</form>

<div style="margin-top:20px;">

<a href="#">
Forgot Password?
</a>

</div>

<div style="margin-top:15px;">

Don't have an account?

<a href="#">

Register Cooperative

</a>

</div>

<hr>

<p class="version">

Version 2.1.0

<br>

© 2026 ABUFAUZAN TECH

</p>

</div>

<script type="module"
src="js/auth.js"></script>

</body>

</html>
</html>
