<!DOCTYPE html>
<html>
<body>

<h2>ABUFAUZAN TECH CMP</h2>
<h3>Balance Sheet Engine Test</h3>

<pre id="output">Running...</pre>

<script type="module">

import {
    generateBalanceSheet
} from "./js/business/balanceSheetEngine.js";

const output = document.getElementById("output");

let report = "";

try {

    report += "=========================================\n";
    report += "ABUFAUZAN TECH CMP\n";
    report += "BALANCE SHEET ENGINE TEST\n";
    report += "=========================================\n\n";

    const result =
        await generateBalanceSheet();

    report += "GENERATE BALANCE SHEET(): PASS\n\n";

    report += JSON.stringify(result, null, 4);

    report += "\n\n=========================================\n";
    report += "TEST COMPLETE\n";
    report += "=========================================";

}
catch (error) {

    report += "GENERATE BALANCE SHEET(): FAIL\n\n";
    report += error.message;

}

output.textContent = report;

</script>

</body>
</html>
