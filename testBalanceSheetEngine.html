<!DOCTYPE html>
<html>
<body>

<h2>ABUFAUZAN TECH CMP</h2>
<h3>Balance Sheet Engine Test</h3>

<pre id="output">Running...</pre>

<script type="module">

import {
    generateBalanceSheet
} from "./js/business/balanceSheetEngine.js?v=rc024a";

const output = document.getElementById("output");

let report = "";

try {

    report += "=========================================\n";
    report += "ABUFAUZAN TECH CMP\n";
    report += "BALANCE SHEET ENGINE TEST\n";
    report += "=========================================\n\n";

    const result =
        await generateBalanceSheet();

    console.log(
        "BALANCE SHEET RESULT:",
        result
    );

    if (result.totalAssets < 0) {

        throw new Error(
            "Invalid total assets."
        );

    }

    if (result.totalLiabilities < 0) {

        throw new Error(
            "Invalid total liabilities."
        );

    }

    if (result.totalEquity < 0) {

        throw new Error(
            "Invalid total equity."
        );

    }

    report +=
        JSON.stringify(
            result,
            null,
            4
        );

    report +=
        "\n\n";

    if (!result.balanced) {

        throw new Error(
            "Balance sheet is not balanced."
        );

    }

    report += "GENERATE BALANCE SHEET(): PASS\n\n";

    report += JSON.stringify(result, null, 4);

    report += "\n\n=========================================\n";
    report += "TEST COMPLETE\n";
    report += "=========================================";

}
catch (error) {

    report += "GENERATE BALANCE SHEET(): FAIL\n\n";
    report += error.message;

}

output.textContent = report;

</script>

</body>
</html>
