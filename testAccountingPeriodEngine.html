<!DOCTYPE html>
<html>
<body>

<h2>ABUFAUZAN TECH CMP</h2>
<h3>Accounting Period Engine Test</h3>

<pre id="output">Running...</pre>

<script type="module">

import { createPeriod } from "./js/business/accountingPeriodEngine.js";
import { createYear } from "./js/business/financialYearEngine.js";

const output = document.getElementById("output");

let report = "";

try {
        const financialYear = await createYear({
            name: "FY 2026 Accounting Period Engine Test",
            startDate: "2026-01-01",
            endDate: "2026-12-31"
        });

        report += "=========================================\n";
    report += "ABUFAUZAN TECH CMP\n";
    report += "ACCOUNTING PERIOD ENGINE TEST\n";
    report += "=========================================\n\n";

    const result = await createPeriod({

        name: "August 2026",
            financialYearId: financialYear.id,
            startDate: "2026-08-01",
            endDate: "2026-08-31"

    });

    report += "CREATE ACCOUNTING PERIOD(): PASS\n\n";
    report += JSON.stringify(result, null, 4);

    report += "\n\n=========================================\n";
    report += "TEST COMPLETE\n";
    report += "=========================================";

}
catch (error) {

    report += "CREATE ACCOUNTING PERIOD(): FAIL\n\n";
    report += error.message;

}

output.textContent = report;

</script>

</body>
</html>
