<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>D124 Create Fixture</title>
</head>
<body>
<pre id="output">Running...</pre>

<script type="module">
import { auth } from "./js/firebase-config.js";
import {
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";
import { createYear } from "./js/business/financialYearEngine.js";
import { createPeriod } from "./js/business/accountingPeriodEngine.js";

const output = document.getElementById("output");

function print(value) {
  output.textContent += value + "\n";
}

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    output.textContent = "AUTHENTICATION: FAIL";
    return;
  }

  try {
    output.textContent = "";
    print("D124 CONTROLLED FIXTURE CREATION");
    print("AUTHENTICATION: PASS");
    print("TARGET FINANCIAL YEAR: 2030");
    print("TARGET PERIOD: JANUARY 2030");

    const yearResult = await createYear({
      name: "D124 E2E FY 2030",
      startDate: "2030-01-01",
      endDate: "2030-12-31"
    });

    print("FINANCIAL YEAR CREATION: PASS");
    print(JSON.stringify(yearResult, null, 2));

    const yearId = yearResult.id;

    if (!yearId) {
      throw new Error("Financial year ID was not returned.");
    }

    const periodResult = await createPeriod({
      name: "D124 E2E January 2030",
      financialYearId: yearId,
      startDate: "2030-01-01",
      endDate: "2030-01-31"
    });

    print("ACCOUNTING PERIOD CREATION: PASS");
    print(JSON.stringify(periodResult, null, 2));

    if (!periodResult?.id) {
      throw new Error("Accounting period ID was not returned.");
    }

    print("===== D124 FIXTURE CREATION COMPLETE =====");
    print("FINANCIAL YEAR ID: " + yearId);
    print("ACCOUNTING PERIOD ID: " + periodResult.id);
    print("FINANCIAL YEAR ID PROPAGATION: " +
      (periodResult.period?.financialYearId === yearId
        ? "PASS"
        : "FAIL"));
  } catch (error) {
    output.textContent +=
      "\nD124 FIXTURE CREATION: FAIL\n" +
      (error?.stack || error?.message || String(error));
  }
});
</script>
</body>
</html>
