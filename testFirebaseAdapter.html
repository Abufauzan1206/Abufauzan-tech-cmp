<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CMP Firebase Adapter Test</title>

<style>
body{
    font-family:Arial,sans-serif;
    margin:20px;
}
pre{
    background:#f4f4f4;
    padding:15px;
    border-radius:8px;
    white-space:pre-wrap;
}
</style>
</head>
<body>

<h2>ABUFAUZAN TECH CMP</h2>
<h3>Firebase Adapter Test</h3>

<pre id="output">Running test...</pre>

<script type="module">

import { CMPFirebaseAdapter } from "./js/adapters/firebaseAdapter.js";

const output = document.getElementById("output");

let report = "";

report += "=========================================\n";
report += "ABUFAUZAN TECH CMP\n";
report += "FIREBASE ADAPTER TEST\n";
report += "=========================================\n\n";

try {

    const adapter = new CMPFirebaseAdapter("adapterTest");

    const documentId = await adapter.create({
        name: "Adapter Test",
        status: "SUCCESS",
        createdBy: "CMP"
    });

    report += "CREATE(): PASS\n";
    report += "Document ID: " + documentId + "\n\n";

    const record = await adapter.findById(documentId);

    report += "FIND BY ID(): PASS\n";
    report += JSON.stringify(record, null, 4) + "\n\n";

    const records = await adapter.findAll();

    report += "FIND ALL(): PASS\n";
    report += "Total Records: " + records.length + "\n";

}
catch(error){

    report += "TEST FAILED\n\n";
    report += error.message;

}

report += "\n=========================================\n";
report += "TEST COMPLETE\n";
report += "=========================================";

output.textContent = report;

</script>

</body>
</html>
