cat > testFirebaseAdapter.html <<'EOF'
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CMP Firebase Adapter Test</title>
<style>
body{font-family:Arial,sans-serif;margin:20px;}
pre{background:#f4f4f4;padding:15px;border-radius:8px;white-space:pre-wrap;}
</style>
</head>
<body>

<h2>ABUFAUZAN TECH CMP</h2>
<h3>Firebase Adapter Test</h3>

<pre id="output">Running...</pre>

<script type="module">

import { CMPFirebaseAdapter } from "./js/adapters/firebaseAdapter.js";

const output = document.getElementById("output");

let report = "";

report += "=========================================\n";
report += "ABUFAUZAN TECH CMP\n";
report += "FIREBASE ADAPTER TEST\n";
report += "=========================================\n\n";

try {

    const adapter = new CMPFirebaseAdapter("adapterTest");

    const id = await adapter.create({
        name: "Adapter Test",
        status: "SUCCESS",
        createdBy: "CMP"
    });

    report += "CREATE(): PASS\n";
    report += "Document ID: " + id + "\n\n";

    const record = await adapter.findById(id);

    report += "FIND BY ID(): PASS\n";
    report += JSON.stringify(record, null, 4) + "\n\n";

    const all = await adapter.findAll();

    report += "FIND ALL(): PASS\n";
    report += "Total Records: " + all.length + "\n\n";

    const updated = await adapter.update(id, {
        status: "UPDATED"
    });

    report += "UPDATE(): PASS\n";
    report += JSON.stringify(updated, null, 4) + "\n";

}
catch(error){

    report += "TEST FAILED\n\n";
    report += error.message;

}

report += "\n=========================================\n";
report += "TEST COMPLETE\n";
report += "=========================================";

output.textContent = report;

</script>

</body>
</html>
