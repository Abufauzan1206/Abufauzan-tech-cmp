<!DOCTYPE html>
<html>
<body>

<h2>ABUFAUZAN TECH CMP</h2>
<h3>Firebase Adapter CRUD Test</h3>

<pre id="output">Running...</pre>

<script type="module">

import { CMPFirebaseAdapter } from "./js/adapters/firebaseAdapter.js";

const output = document.getElementById("output");

let report = "";

try {

const adapter = new CMPFirebaseAdapter("adapterTest");

report += "=========================================\n";
report += "ABUFAUZAN TECH CMP\n";
report += "FIREBASE ADAPTER CRUD TEST\n";
report += "=========================================\n\n";


const id = await adapter.create({

    name:"Adapter Test",
    status:"SUCCESS",
    createdBy:"CMP"

});


report += "CREATE(): PASS\n";
report += "ID: " + id + "\n\n";


const record = await adapter.findById(id);


report += "FIND BY ID(): PASS\n";
report += JSON.stringify(record,null,4) + "\n\n";


const all = await adapter.findAll();


report += "FIND ALL(): PASS\n";
report += "Total Records: " + all.length + "\n\n";


const updated = await adapter.update(id,{

    status:"UPDATED"

});


report += "UPDATE(): PASS\n";
report += JSON.stringify(updated,null,4) + "\n\n";


await adapter.delete(id);


const deleted = await adapter.findById(id);


if(deleted === null){

    report += "DELETE(): PASS\n";

}
else{

    report += "DELETE(): FAILED\n";

}


}

catch(error){

report += "ERROR:\n";
report += error.message;

}


report += "\n=========================================\n";
report += "TEST COMPLETE\n";
report += "=========================================";


output.textContent = report;


</script>

</body>
</html>
