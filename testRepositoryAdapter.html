<!DOCTYPE html>
<html>
<body>

<h2>ABUFAUZAN TECH CMP</h2>
<h3>Repository Adapter Integration Test</h3>

<pre id="output">Running...</pre>

<script type="module">

import { CMPBaseRepository } from "./js/repositories/baseRepository.js";
import { CMPFirebaseAdapter } from "./js/adapters/firebaseAdapter.js";


const output = document.getElementById("output");

let report = "";


try {


const adapter = new CMPFirebaseAdapter("repositoryTest");


const repository = new CMPBaseRepository(adapter);



report += "=========================================\n";
report += "ABUFAUZAN TECH CMP\n";
report += "REPOSITORY ADAPTER TEST\n";
report += "=========================================\n\n";



const id = await repository.create({

    name:"Repository Test",

    status:"SUCCESS",

    createdBy:"CMP"

});


report += "CREATE(): PASS\n";
report += "ID: " + id + "\n\n";



const record = await repository.findById(id);


report += "FIND BY ID(): PASS\n";
report += JSON.stringify(record,null,4) + "\n\n";



const all = await repository.findAll();


report += "FIND ALL(): PASS\n";
report += "Total Records: " + all.length + "\n\n";



const updated = await repository.update(id,{

    status:"UPDATED"

});


report += "UPDATE(): PASS\n";
report += JSON.stringify(updated,null,4) + "\n\n";



await repository.delete(id);


report += "DELETE(): PASS\n";



}

catch(error){

report += "ERROR:\n";
report += error.message;

}



report += "\n=========================================\n";
report += "TEST COMPLETE\n";
report += "=========================================";


output.textContent = report;


</script>

</body>
</html>
