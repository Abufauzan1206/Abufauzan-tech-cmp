<!DOCTYPE html>
<html>
<body>

<h2>ABUFAUZAN TECH CMP</h2>
<h3>Financial Year Engine Test</h3>

<pre id="output">Running...</pre>

<script type="module">

import {
    createYear
} from "./js/business/financialYearEngine.js";


const output =
    document.getElementById("output");

let report = "";


try {

    report += "=========================================\n";
    report += "ABUFAUZAN TECH CMP\n";
    report += "FINANCIAL YEAR ENGINE TEST\n";
    report += "=========================================\n\n";


    const result =
        await createYear({

            name:
                "FY 2027",

            startDate:
                "2027-01-01",

            endDate:
                "2027-12-31"

        });


    report +=
        "CREATE FINANCIAL YEAR(): PASS\n\n";


    report +=
        JSON.stringify(
            result,
            null,
            4
        );


}
catch(error) {

    report +=
        "CREATE FINANCIAL YEAR(): FAIL\n\n";

    report +=
        error.message;

}


report +=
    "\n\n=========================================\n";

report +=
    "TEST COMPLETE\n";

report +=
    "=========================================";


output.textContent =
    report;


</script>

</body>
</html>
