<!DOCTYPE html>
<html>
<body>

<h2>ABUFAUZAN TECH CMP</h2>
<h3>Trial Balance Engine Test</h3>

<pre id="output">Running...</pre>

<script type="module">

import {
    generateTrialBalance
} from "./js/business/trialBalanceEngine.js";


const output =
    document.getElementById("output");

let report = "";


try {

    report += "=========================================\n";
    report += "ABUFAUZAN TECH CMP\n";
    report += "TRIAL BALANCE ENGINE TEST\n";
    report += "=========================================\n\n";


    const result =
        await generateTrialBalance();


    report += "GENERATE TRIAL BALANCE(): PASS\n\n";

    report += JSON.stringify(
        result,
        null,
        4
    );


    report += "\n\n=========================================\n";
    report += "TEST COMPLETE\n";
    report += "=========================================";


}
catch(error) {

    report += "GENERATE TRIAL BALANCE(): FAIL\n\n";
    report += error.message;

}


output.textContent = report;


</script>

</body>
</html>
