<!DOCTYPE html>
<html>
<body>

<h2>ABUFAUZAN TECH CMP</h2>
<h3>Ledger Posting Engine Test</h3>

<pre id="output">Running...</pre>

<script type="module">

import {
    postLedger
} from "./js/business/ledgerPostingEngine.js";

const output = document.getElementById("output");

let report = "";

try {

    report += "=========================================\n";
    report += "ABUFAUZAN TECH CMP\n";
    report += "LEDGER POSTING ENGINE TEST\n";
    report += "=========================================\n\n";

    const result = await postLedger({
        account: "Cash Account",
        debit: 50000,
        credit: 0,
        createdBy: "CMP"
    });

    report += "POST LEDGER(): PASS\n\n";
    report += JSON.stringify(result, null, 4);

    report += "\n\n=========================================\n";
    report += "TEST COMPLETE\n";
    report += "=========================================";

}
catch (error) {

    report += "POST LEDGER(): FAIL\n\n";
    report += error.message;

}

output.textContent = report;

</script>

</body>
</html>
