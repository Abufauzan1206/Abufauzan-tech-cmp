<link rel="stylesheet"
href="modules/register-cooperative/style.css">

<div id="registerModule">

<h2>Register Cooperative</h2>

<p>
Complete the form below to register a new cooperative.
</p>
<form id="registerCooperativeForm" novalidate>

<h3>Cooperative Information</h3>

<input
type="text"
id="coopName"
placeholder="Cooperative Name"
required>

<input
type="text"
id="registrationNumber"
placeholder="Registration Number (Optional)">

<select id="coopType" required>

<option value="">Select Cooperative Type</option>

<option>Multipurpose</option>

<option>Staff</option>

<option>Community</option>

<option>Religious</option>

<option>Agricultural</option>

<option>Investment</option>

</select>

<input
type="text"
id="country"
placeholder="Country"
required>

<input
type="text"
id="state"
placeholder="State / Province"
required>

<input
type="text"
id="city"
placeholder="City / Local Government"
required>

<textarea
id="officeAddress"
placeholder="Office Address"
rows="3"></textarea>

<hr>

<h3>Official Contact</h3>

<input
type="email"
id="coopEmail"
placeholder="Official Email"
required>

<input
type="tel"
id="coopPhone"
placeholder="Official Phone Number"
required>

<hr>

<h3>Cooperative Administrator</h3>

<input
type="text"
id="adminName"
placeholder="Administrator Full Name"
required>

<input
type="email"
id="adminEmail"
placeholder="Administrator Email"
required>

<input
type="password"
id="adminPassword"
placeholder="Temporary Password"
required>

<hr>

<h3>Subscription</h3>

<select id="subscriptionPlan">

<option>Trial</option>

<option>Basic</option>

<option>Standard</option>

<option>Premium</option>

</select>

<button type="submit">

Create Cooperative

</button>

</form>

</div>
