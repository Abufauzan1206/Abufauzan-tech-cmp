<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Apply Loan</title>

<link rel="stylesheet"
href="../../css/style.css">

<link rel="stylesheet"
href="style.css">

</head>

<body>

<div class="container">

<h1>🏦 Loan Application</h1>

<form id="loanForm">

<label>Member</label>

<select id="memberId">

</select>

<label>Loan Amount (₦)</label>

<input
type="number"
id="amount"
required>

<label>Purpose</label>

<input
type="text"
id="purpose"
required>

<label>Repayment Period (Months)</label>

<input
type="number"
id="repaymentMonths"
required>

<br><br>

<button type="submit">

Submit Loan Application

</button>

</form>

</div>

<script type="module"
src="script.js"></script>

</body>

</html>
