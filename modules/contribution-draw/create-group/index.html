<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Create Draw Group</title>

</head>

<body>

<h1>📦 Create Draw Group</h1>

<form id="groupForm">

<label>
Group Name
</label>

<br>

<input
type="text"
id="groupName"
required>

<br><br>

<label>
Start Month
</label>

<br>

<select id="startMonth">

<option>January</option>
<option>February</option>
<option>March</option>
<option>April</option>
<option>May</option>
<option>June</option>
<option>July</option>
<option>August</option>
<option>September</option>
<option>October</option>
<option>November</option>
<option>December</option>

</select>

<br><br>

<label>
Start Year
</label>

<br>

<input
type="number"
id="startYear"
value="2026"
required>

<br><br>

<label>
Maximum Slots
</label>

<br>

<input
type="number"
id="maxSlots"
required>

<br><br>

<label>
Maximum Slots Per Member
</label>

<input
type="number"
id="maxSlotsPerMember"
value="1"
required>

<br><br>

<br><br>

<label>
Draw Preparation Policy
</label>

<br>

<select id="drawPreparationPolicy">

<option value="Full Capacity">
Require Full Capacity (Default)
</option>

<option value="Allow Early Draw">
Allow Early Draw
</option>

</select>

<br><br>

<button type="submit">
Create Group
</button>

</form>

<script type="module"
src="script.js"></script>

</body>

</html>
