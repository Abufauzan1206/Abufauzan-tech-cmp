<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Record Contribution</title>

<link rel="stylesheet"
href="../../css/style.css">

<link rel="stylesheet"
href="style.css">

</head>

<body>

<div class="container">

<h1>💰 Record Contribution</h1>

<form id="contributionForm">

<label>Member ID</label>

<select id="memberId">
  
  </select>

<label>Amount (₦)</label>

<input
type="number"
id="amount"
required>

<label>Payment Method</label>

<select id="paymentMethod">

<option value="Cash">
Cash
</option>

<option value="Transfer">
Transfer
</option>

<option value="POS">
POS
</option>

</select>

<br><br>

<button type="submit">

Save Contribution

</button>

</form>

</div>

<script type="module"
src="script.js"></script>

</body>

</html>
