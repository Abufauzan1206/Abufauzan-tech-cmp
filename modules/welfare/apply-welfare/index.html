<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Apply for Welfare</title>

<link rel="stylesheet"
href="../../css/style.css">

<link rel="stylesheet"
href="style.css">

</head>

<body>

<div class="container">

<h1>❤️ Welfare Application</h1>

<form id="welfareForm">

<label>Member ID</label>

<input
type="text"
id="memberId"
required>

<label>Request Type</label>

<select id="requestType">

<option value="Medical Support">
Medical Support
</option>

<option value="Emergency Support">
Emergency Support
</option>

<option value="Bereavement Support">
Bereavement Support
</option>

<option value="Education Support">
Education Support
</option>

<option value="Food Support">
Food Support
</option>

<option value="Other">
Other
</option>

</select>

<label>Amount (₦)</label>

<input
type="number"
id="amount"
required>

<label>Reason</label>

<textarea
id="reason"
rows="4"
required>
</textarea>

<br><br>

<button type="submit">

Submit Request

</button>

</form>

</div>

<script type="module"
src="script.js"></script>

</body>

</html>
