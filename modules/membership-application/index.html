<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply for Membership</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main id="membershipApplication">
        <h1>Apply for Membership</h1>

        <p>
            Complete the form below to submit your membership application.
            Your application will remain pending until reviewed by the
            cooperative.
        </p>

        <form id="membershipApplicationForm" novalidate>

            <h2>Personal Information</h2>

            <label>
                First Name
                <input
                    type="text"
                    id="firstName"
                    name="firstName"
                    required
                >
            </label>

            <label>
                Middle Name
                <input
                    type="text"
                    id="middleName"
                    name="middleName"
                >
            </label>

            <label>
                Last Name
                <input
                    type="text"
                    id="lastName"
                    name="lastName"
                    required
                >
            </label>

            <label>
                Phone Number
                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    required
                >
            </label>

            <label>
                Email
                <input
                    type="email"
                    id="email"
                    name="email"
                >
            </label>

            <h2>Cooperative</h2>

            <label>
                Cooperative
                <select
                    id="cooperativeId"
                    name="cooperativeId"
                    required
                >
                    <option value="">
                        Select Cooperative
                    </option>
                </select>
            </label>

            <p id="cooperativeMessage"></p>

            <button type="submit">
                Submit Membership Application
            </button>

        </form>

        <p id="applicationMessage"></p>
    </main>

    <script type="module" src="./app.js"></script>
</body>
</html>
