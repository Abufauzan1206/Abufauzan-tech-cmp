<!DOCTYPE html>
<html>
<body>

<h2>ABUFAUZAN TECH CMP</h2>
<h3>RC005 Trial Balance Test</h3>

<pre id="output">Running...</pre>

<script type="module">

import {
    generateTrialBalance
} from "./js/business/trialBalanceEngine.js";


const output =
    document.getElementById("output");


let report = "";


try {

    report += "=========================================\n";
    report += "ABUFAUZAN TECH CMP\n";
    report += "RC005 - TRIAL BALANCE TEST\n";
    report += "=========================================\n\n";


    const result =
        await generateTrialBalance();


    if (!result.balanced) {

        throw new Error(
            "Trial balance is not balanced."
        );

    }


    report += "TRIAL BALANCE: PASS\n\n";

    report += JSON.stringify(
        result,
        null,
        4
    );


}
catch(error) {

    report += "TRIAL BALANCE: FAIL\n\n";
    report += error.message;

}


output.textContent = report;


</script>

</body>
</html>
