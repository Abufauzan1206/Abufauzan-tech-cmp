<!DOCTYPE html>
<html>
<body>

<h2>ABUFAUZAN TECH CMP</h2>
<h3>Contribution Service Test</h3>

<pre id="output">Running...</pre>

<script type="module">

import {
    createContribution,
    getContributionById,
    updateContribution,
    deleteContribution
} from "./js/services/contributionService.js";

const output = document.getElementById("output");

let report = "";

try {

report += "=========================================\n";
report += "ABUFAUZAN TECH CMP\n";
report += "CONTRIBUTION SERVICE TEST\n";
report += "=========================================\n\n";

const id = await createContribution({

    memberId: "MEMBER001",

    amount: 25000,

    month: "August 2026",

    status: "SUCCESS",

    createdBy: "CMP"

});

report += "CREATE CONTRIBUTION SERVICE(): PASS\n";
report += "ID: " + id + "\n\n";

const record = await getContributionById(id);

report += "GET CONTRIBUTION SERVICE(): PASS\n";
report += JSON.stringify(record, null, 4) + "\n\n";

await updateContribution(id, {
    status: "UPDATED"
});

report += "UPDATE CONTRIBUTION SERVICE(): PASS\n\n";

await deleteContribution(id);

report += "DELETE CONTRIBUTION SERVICE(): PASS\n";

}

catch(error){

report += "ERROR:\n";
report += error.message;

}

report += "\n=========================================\n";
report += "TEST COMPLETE\n";
report += "=========================================";

output.textContent = report;

</script>

</body>
</html>
