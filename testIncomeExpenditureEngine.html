<!DOCTYPE html>
<html>
<body>

<h2>ABUFAUZAN TECH CMP</h2>
<h3>Income & Expenditure Engine Test</h3>

<pre id="output">Running...</pre>

<script type="module">

import {
    generateIncomeExpenditure
} from "./js/business/incomeExpenditureEngine.js?rc020";

const output = document.getElementById("output");

let report = "";

try {

    report += "=========================================\n";
    report += "ABUFAUZAN TECH CMP\n";
    report += "INCOME & EXPENDITURE ENGINE TEST\n";
    report += "=========================================\n\n";

    const result =
        await generateIncomeExpenditure();

    if (result.totalIncome < 0) {

        throw new Error(
            "Invalid total income."
        );

    }

    if (result.totalExpenses < 0) {

        throw new Error(
            "Invalid total expenses."
        );

    }

    if (
        result.netSurplus !==
        result.totalIncome -
        result.totalExpenses
    ) {

        throw new Error(
            "Net surplus calculation is incorrect."
        );

    }

    report += "GENERATE INCOME & EXPENDITURE(): PASS\n\n";

    report += JSON.stringify(result, null, 4);

    report += "\n\n=========================================\n";
    report += "TEST COMPLETE\n";
    report += "=========================================";

}
catch (error) {

    report += "GENERATE INCOME & EXPENDITURE(): FAIL\n\n";
    report += error.message;

}

output.textContent = report;

</script>

</body>
</html>
