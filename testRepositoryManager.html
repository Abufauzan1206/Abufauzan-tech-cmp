<!DOCTYPE html>
<html>
<body>

<h2>ABUFAUZAN TECH CMP</h2>
<h3>Repository Manager Test</h3>

<pre id="output">Running...</pre>

<script type="module">

import { CMPRepositoryManager }
from "./js/repositories/repositoryManager.js";


const output = document.getElementById("output");

let report = "";


try {

report += "=========================================\n";
report += "ABUFAUZAN TECH CMP\n";
report += "REPOSITORY MANAGER TEST\n";
report += "=========================================\n\n";


const journalRepo = CMPRepositoryManager.get("journal");


report += "GET JOURNAL REPOSITORY(): PASS\n\n";


const id = await journalRepo.create({

    title:"Manager Test Journal",

    amount:30000,

    status:"SUCCESS",

    createdBy:"CMP"

});


report += "CREATE THROUGH MANAGER(): PASS\n";
report += "ID: " + id + "\n\n";


const record = await journalRepo.findById(id);


report += "FIND THROUGH MANAGER(): PASS\n";
report += JSON.stringify(record,null,4) + "\n\n";


await journalRepo.delete(id);


report += "DELETE THROUGH MANAGER(): PASS\n";


}


catch(error){

report += "ERROR:\n";
report += error.message;

}


report += "\n=========================================\n";
report += "TEST COMPLETE\n";
report += "=========================================";


output.textContent = report;


</script>

</body>
</html>
