<!DOCTYPE html>
<html>
<body>

<h2>ABUFAUZAN TECH CMP</h2>
<h3>Transaction Service Test</h3>

<pre id="output">Running...</pre>

<script type="module">

import {
    createTransaction,
    getTransactionById,
    updateTransaction,
    deleteTransaction
} from "./js/services/transactionService.js";

const output = document.getElementById("output");

let report = "";

try {

report += "=========================================\n";
report += "ABUFAUZAN TECH CMP\n";
report += "TRANSACTION SERVICE TEST\n";
report += "=========================================\n\n";

const id = await createTransaction({

    type: "CONTRIBUTION",

    amount: 15000,

    status: "SUCCESS",

    createdBy: "CMP"

});

report += "CREATE TRANSACTION SERVICE(): PASS\n";
report += "ID: " + id + "\n\n";

const record = await getTransactionById(id);

report += "GET TRANSACTION SERVICE(): PASS\n";
report += JSON.stringify(record, null, 4) + "\n\n";

await updateTransaction(id, {
    status: "UPDATED"
});

report += "UPDATE TRANSACTION SERVICE(): PASS\n\n";

await deleteTransaction(id);

report += "DELETE TRANSACTION SERVICE(): PASS\n";

}

catch(error){

report += "ERROR:\n";
report += error.message;

}

report += "\n=========================================\n";
report += "TEST COMPLETE\n";
report += "=========================================";

output.textContent = report;

</script>

</body>
</html>
