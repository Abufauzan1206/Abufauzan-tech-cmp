<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>D124 Firebase Connectivity Diagnostic</title>
</head>
<body>
<pre id="out">D124 FIREBASE CONNECTIVITY DIAGNOSTIC\n</pre>

<script type="module">
import { auth, db } from "./js/firebase-config.js";
import {
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";
import {
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const out = document.getElementById("out");

function log(label, value) {
  out.textContent += label + ": " + value + "\n";
}

log("BROWSER ONLINE", navigator.onLine);
log("ORIGIN", location.origin);
log("USER AGENT", navigator.userAgent);

onAuthStateChanged(auth, async (user) => {
  log("AUTH STATE", user ? "SIGNED_IN" : "SIGNED_OUT");

  if (!user) {
    log("AUTH UID", "NONE");
    return;
  }

  log("AUTH UID", user.uid);

  try {
    const snap = await getDoc(doc(db, "users", user.uid));

    log("FIRESTORE GETDOC", "PASS");
    log("PROFILE EXISTS", snap.exists());

    if (snap.exists()) {
      log("PROFILE ROLE", snap.data()?.role ?? "NONE");
    }
  } catch (error) {
    log("FIRESTORE GETDOC", "FAIL");
    log("ERROR NAME", error?.name ?? "UNKNOWN");
    log("ERROR CODE", error?.code ?? "NONE");
    log("ERROR MESSAGE", error?.message ?? String(error));
  }
});
</script>
</body>
</html>
